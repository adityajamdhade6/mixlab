[project]
name = "mixlab"
version = "0.1.0"
description = "Bayesian Marketing Mix Model and budget optimizer with an AI explanation layer."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pymc-marketing>=0.19.2,<0.20",
    "pymc",
    "arviz",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "plotly",
    "streamlit>=1.50",
    "anthropic>=1.11,<2",
    "python-dotenv",
    "pydantic",
    "nutpie>=0.16.8",
    "pyyaml>=6.0.3",
    "fpdf2>=2.8.9",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mixlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
